name: Torre Eterna — portões de qualidade

on:
  push:
    paths: ["torre-eterna/**", ".github/workflows/torre-eterna.yml"]
  pull_request:
    paths: ["torre-eterna/**"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  portoes:
    name: Verificação, dados, testes e desempenho
    runs-on: ubuntu-latest
    # Os portões longos cresceram: o simulador roda 2 h de jogo (era 1), o de
    # desempenho mede duas pernas e o portão 8 sobe o jogo com tela três vezes.
    # 25 minutos ficaram apertados para o runner, que é mais lento que a máquina
    # de quem desenvolve.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Baixar Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL --retry 3 -o godot.zip "$URL"
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version

      - name: Importar o projeto (gera .godot e o cache de classes)
        working-directory: torre-eterna
        run: godot --headless --path . --editor --quit 2>&1 | tail -5 || true

      # Cada portão imprime "===STATUS=== PASS". O exit code do Godot não é
      # confiável, então o contrato é o bloco — igual ao AGENTS.md manda.
      # O `|| true` em cada captura não afrouxa nada: sem ele, `set -e` mata o
      # passo na hora da atribuição e o `echo` nunca roda, então uma falha
      # chegava aqui sem uma linha sequer de diagnóstico. Quem reprova é o grep.
      - name: Portão 1 — todo script compila e os dados existem
        working-directory: torre-eterna
        run: |
          set -euo pipefail
          saida=$(godot --headless --path . -s res://tools/verificar.gd 2>&1) || true
          echo "$saida"
          echo "$saida" | grep -q "===STATUS=== PASS"

      - name: Portão 2 — convenções do projeto (linter)
        working-directory: torre-eterna
        run: |
          set -euo pipefail
          saida=$(godot --headless --path . -s res://tools/lint.gd 2>&1) || true
          echo "$saida"
          echo "$saida" | grep -q "===STATUS=== PASS"

      - name: Portão 3 — conteúdo obedece ao contrato
        working-directory: torre-eterna
        run: |
          set -euo pipefail
          saida=$(godot --headless --path . -s res://tools/validar_dados.gd 2>&1) || true
          echo "$saida"
          echo "$saida" | grep -q "===STATUS=== PASS"

      - name: Portão 4 — testes da simulação
        working-directory: torre-eterna
        run: |
          set -euo pipefail
          saida=$(godot --headless --path . -s res://tools/testes.gd 2>&1) || true
          echo "$saida"
          echo "$saida" | grep -q "===STATUS=== PASS"

      - name: Portão 5 — desempenho com a arena cheia
        working-directory: torre-eterna
        run: |
          set -euo pipefail
          saida=$(godot --headless --path . -s res://tools/perf.gd -- 412 2>&1) || true
          echo "$saida"
          echo "$saida" | grep -q "===STATUS=== PASS"

      - name: Portão 6 — verificação estrutural do kit
        working-directory: torre-eterna
        run: |
          set -euo pipefail
          saida=$(godot --headless --path . -s res://agent_verify.gd 2>&1) || true
          echo "$saida"
          echo "$saida" | grep -q '"status": "PASS"'

      - name: Resistência — 1h de jogo com invariantes checadas
        working-directory: torre-eterna
        run: |
          set -euo pipefail
          saida=$(godot --headless --path . -s res://tools/soak.gd -- 1 2>&1) || true
          echo "$saida"
          echo "$saida" | grep -q "===STATUS=== PASS"

      # O simulador é o único portão que roda o jogo por horas seguidas com a
      # automação ligada. Erro em tempo de execução não aparece nos testes (que
      # chamam funções isoladas) e aparece aqui — já pegou um `Invalid access`
      # que rodava 21.600 vezes numa partida.
      # Este passo cobrava MENOS do que parecia. Ele só procurava por
      # `SCRIPT ERROR`, e a ferramenta não imprimia veredito nenhum numa corrida
      # bem-sucedida: chegar à onda 25 em trinta segundos ou em três horas
      # passava exatamente igual. A faixa do critério 5 era "verificada" por uma
      # pessoa lendo uma tabela. Agora o simulador emite `===STATUS===` cobrando
      # as faixas, e o passo roda `-- 2` como o critério manda, não `-- 1`.
      # 1,2 h e não 2 h, e a razão é aritmética: a faixa mais longa que o
      # critério 5 declara é "onda 100 em 30–60 min", então 72 minutos de jogo
      # é o MÍNIMO que consegue julgar as três faixas — e os 48 minutos a mais
      # não julgam nada que a rubrica peça. Não é afrouxar: é parar de pagar por
      # tempo que não decide nada. A cláusula "sem travar" é cobrada de outro
      # jeito, pela regra de que a onda tem que continuar subindo no último terço.
      - name: Portão 7 — 1,2 h de jogo, sem erro e dentro da faixa
        working-directory: torre-eterna
        run: |
          set -euo pipefail
          saida=$(godot --headless --path . -s res://tools/sim_balance.gd -- 1.2 auto 2>&1) || true
          echo "$saida" | tail -40
          if echo "$saida" | grep -q "SCRIPT ERROR"; then
            echo "::error::o simulador emitiu SCRIPT ERROR"
            echo "$saida" | grep -A1 "SCRIPT ERROR" | head -20
            exit 1
          fi
          echo "$saida" | grep -q "===STATUS=== PASS"

      # Nenhum outro portão DESENHA um quadro. Todos rodam `--headless`, que usa
      # um renderizador burro: as chamadas de desenho nunca são executadas, e um
      # erro de renderização é estruturalmente invisível para eles. Foi assim que
      # 48 `Invalid polygon data, triangulation failed` a cada 30 s de jogo comum
      # viveram no projeto sem nenhum portão reclamar — e captura estática também
      # não mostra, porque o erro sai no stderr, não na imagem.
      - name: Instalar Xvfb (para o portão que desenha)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libxcursor1 libxinerama1 libxi6 libxrandr2

      - name: Portão 8 — o jogo DESENHA sem erro de motor
        working-directory: torre-eterna
        run: |
          set -euo pipefail
          falhou=0
          for cena in "--onda=20" "--onda=120 --painel=conquistas" "--onda=200 --tela=final"; do
            saida=$(xvfb-run -a -s "-screen 0 1280x720x24" \
              godot --path . -- --shot=12 $cena --saida=/tmp/portao8.png 2>&1) || true
            # o driver de áudio ALSA não existe no runner; a falha dele é do
            # ambiente, não do jogo, e o próprio Godot cai no driver mudo
            ruins=$(echo "$saida" | grep -E "^ERROR:|SCRIPT ERROR" \
              | grep -v "audio_driver_alsa" | grep -v "ERR_CANT_OPEN" || true)
            if [ -n "$ruins" ]; then
              echo "::error::o jogo emitiu erro de motor desenhando ($cena)"
              echo "$ruins" | head -20
              falhou=1
            else
              echo "ok: $cena"
            fi
          done
          exit $falhou
