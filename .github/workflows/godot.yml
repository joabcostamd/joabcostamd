name: Godot — portão frio e testes

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSAO: 4.7.2-stable

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache do Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/godot
          key: godot-${{ env.GODOT_VERSAO }}-linux

      - name: Instalar Godot
        run: bash .claude/scripts/preparar-ambiente.sh

      - name: Portão frio + testes de todos os projetos
        run: ./testar-tudo.sh

  modelo-gera-jogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache do Godot
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/godot
          key: godot-${{ env.GODOT_VERSAO }}-linux
      - name: Instalar Godot
        run: bash .claude/scripts/preparar-ambiente.sh
      - name: Um jogo novo nasce verde
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          .claude/scripts/novo-jogo.sh teste-ci "Jogo de Teste"
